server {
    listen localhost:8080;
	client_max_body_size 100;
	root .;

	location / {
		allow_methods GET;
	}

	location /post_body {
		# max_body_size 100;
		allow_methods POST;
	}

	location /directory {
		index youpi.bad_extension;
		root ./YoupiBanane;
		allow_methods GET POST;
	}

	# TODO: When .bla file is requested it should call cgi!
	location .bla {
		cgi_pass .bla ./cgi_tester;
		allow_methods POST;
	}
}
