server {
    listen localhost:9090;
    client_max_body_size 10G;
    mime_types text/markdown  md application/wasm wasm;

    index index.html;

	location / {
		root ./www/html/;
		allow_methods GET;
	}

	location /cgi {
		root ./www/cgi-bin;
        allow_methods POST GET;
		auto_index on;
		cgi_pass .py /bin/python3;
		cgi_pass .sh /usr/bin/bash;
	}

    location /post {
		root ./www/post;
		auto_index on;
        allow_methods POST DELETE GET;
	}
}